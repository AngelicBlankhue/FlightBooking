<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Liên hệ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="23.css">
</head>

<body>

    <header class="w3-bar bg-primary w3-padding">
        <span class="w3-bar-item w3-xlarge">Flight Booking</span>
    </header>

    <div class="w3-container w3-padding-64">
        <div class="w3-card w3-white w3-round-large w3-padding" style="max-width:500px;margin:auto">

            <h2 class="w3-center text-primary"><b>📩 LIÊN HỆ</b></h2>

            <form action="https://formsubmit.co/nhatthangnguyen572@gmail.com" method="POST">

                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_subject" value="Liên hệ từ website Flight Booking">
                <input type="hidden" name="_template" value="table">

                <input class="w3-input w3-border w3-round" type="text" name="name" placeholder="Họ và tên" required>
                <input class="w3-input w3-border w3-round" type="tel" name="phone" placeholder="Số điện thoại" required>
                <input class="w3-input w3-border w3-round" type="email" name="email" placeholder="Email" required>
                <textarea class="w3-input w3-border w3-round" name="message" rows="5" placeholder="Nội dung liên hệ"
                    required></textarea>

                <button class="w3-button btn-primary w3-round-large w3-block">
                    📨 Gửi liên hệ
                </button>
            </form>


            <a href="index.html" class="w3-button w3-light-grey w3-round-large w3-block w3-margin-top">
                ⬅ Trở về trang chủ
            </a>

        </div>
    </div>

    <footer class="bg-primary w3-center w3-padding">
        Chúc bạn một ngày tốt lành!
    </footer>

</body>

</html>
