<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng ký - FlightBooking</title>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-auth-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBKr3kRw_2w3BNfR5dSpsLpsHWg5igeqJw",
            authDomain: "flightbooking-6fcdd.firebaseapp.com",
            projectId: "flightbooking-6fcdd",
            storageBucket: "flightbooking-6fcdd.firebasestorage.app",
            messagingSenderId: "481452769984",
            appId: "1:481452769984:web:45c32d3c9d3b6a92dba325",
            measurementId: "G-J929JY5NQY"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
    </script>


    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef7ff;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .register-box {

            width: 400px;
            max-width: 90%;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.12);
        }

        .register-box h1 {

            text-align: center;

            color: #1683d8;

            margin-bottom: 10px;
        }

        .subtitle {

            text-align: center;

            color: #555;

            margin-bottom: 25px;
        }

        label {

            display: block;

            margin-top: 15px;

            margin-bottom: 6px;

            font-weight: bold;
        }

        input {

            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }

        input:focus {

            border-color: #1683d8;
        }

        button {

            width: 100%;

            margin-top: 25px;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #1683d8;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {

            background: #0f6fb8;
        }


        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            padding-right: 48px;
        }

        .toggle-password {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: auto;
            margin: 0;
            padding: 5px 7px;
            background: transparent;
            color: #1683d8;
            font-size: 18px;
            cursor: pointer;
        }

        .toggle-password:hover {
            background: transparent;
            color: #0f6fb8;
        }

        .password-hint {
            display: block;
            margin-top: 6px;
            color: #176B87;
            font-size: 13px;
            line-height: 1.4;
        }

        #thongbao {

            margin-top: 15px;

            text-align: center;

            font-weight: bold;
        }

        .login-link {

            text-align: center;

            margin-top: 20px;
        }

        .login-link a {

            color: #1683d8;

            text-decoration: none;

            font-weight: bold;
        }
    </style>

</head>


<body>


    <div class="register-box">

        <h1>✈️ Đăng ký</h1>

        <div class="subtitle">
            Tạo tài khoản FlightBooking
        </div>


        <form id="formDangKy">


            <label for="hoTen">
                Họ và tên
            </label>

            <input type="text" id="hoTen" placeholder="Nhập họ và tên" required>


            <label for="email">
                Email
            </label>

            <input type="email" id="email" placeholder="example@gmail.com" required>


            <label for="matKhau">
                Mật khẩu
            </label>

            <div class="password-wrapper">
                <input type="password" id="matKhau"
                    placeholder="Ít nhất 6 ký tự, có chữ IN HOA và ký tự đặc biệt"
                    minlength="6" required>
                <button type="button" class="toggle-password"
                    onclick="togglePassword('matKhau', this)">👁️</button>
            </div>
            <small class="password-hint">
                Mật khẩu: ít nhất 6 ký tự, có 1 chữ IN HOA và 1 ký tự đặc biệt.
            </small>


            <label for="xacNhanMatKhau">
                Xác nhận mật khẩu
            </label>

            <div class="password-wrapper">
                <input type="password" id="xacNhanMatKhau"
                    placeholder="Nhập lại mật khẩu"
                    minlength="6" required>
                <button type="button" class="toggle-password"
                    onclick="togglePassword('xacNhanMatKhau', this)">👁️</button>
            </div>


            <button type="submit">
                📝 Đăng ký
            </button>


        </form>


        <div id="thongbao"></div>


        <div class="login-link">

            Đã có tài khoản?

            <a href="dangnhap.html">
                Đăng nhập
            </a>

        </div>


    </div>


    <script>
        // Hiện / ẩn mật khẩu
        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);

            if (input.type === "password") {
                input.type = "text";
                button.innerText = "🙈";
            } else {
                input.type = "password";
                button.innerText = "👁️";
            }
        }

        document
            .getElementById("formDangKy")
            .addEventListener("submit", async function (event) {

                event.preventDefault();

                const hoTen =
                    document.getElementById("hoTen").value.trim();

                const email =
                    document.getElementById("email").value.trim();

                const matKhau =
                    document.getElementById("matKhau").value;

                const xacNhan =
                    document.getElementById("xacNhanMatKhau").value;

                const thongBao =
                    document.getElementById("thongbao");

                // =========================
                // KIỂM TRA DỮ LIỆU
                // =========================

                if (hoTen.length < 2) {
                    thongBao.innerHTML =
                        "❌ Vui lòng nhập họ và tên.";
                    thongBao.style.color = "red";
                    return;
                }

                if (matKhau.length < 6) {
                    thongBao.innerHTML =
                        "❌ Mật khẩu phải có ít nhất 6 ký tự.";
                    thongBao.style.color = "red";
                    return;
                }

                if (!/[A-Z]/.test(matKhau)) {
                    thongBao.innerHTML =
                        "❌ Mật khẩu phải có ít nhất 1 chữ IN HOA.";
                    thongBao.style.color = "red";
                    return;
                }

                if (!/[!@#$%^&*(),.?":{}|<>_\-\\\/+=~`';\[\]]/.test(matKhau)) {
                    thongBao.innerHTML =
                        "❌ Mật khẩu phải có ít nhất 1 ký tự đặc biệt.";
                    thongBao.style.color = "red";
                    return;
                }

                if (matKhau !== xacNhan) {
                    thongBao.innerHTML =
                        "❌ Mật khẩu xác nhận không giống nhau.";
                    thongBao.style.color = "red";
                    return;
                }

                // =========================
                // ĐĂNG KÝ FIREBASE
                // =========================

                try {
                    thongBao.innerHTML =
                        "⏳ Đang tạo tài khoản...";
                    thongBao.style.color = "#1683d8";

                    const userCredential =
                        await firebase
                            .auth()
                            .createUserWithEmailAndPassword(
                                email,
                                matKhau
                            );

                    const user = userCredential.user;

                    // Lưu họ tên ngay trong Firebase Authentication.
                    // Việc này không phụ thuộc Firestore Rules.
                    await user.updateProfile({
                        displayName: hoTen
                    });

                    // Lưu thêm vào Firestore nếu Rules cho phép.
                    // Nếu Firestore bị chặn, tài khoản Auth vẫn đăng ký thành công.
                    try {
                        await db
                            .collection("users")
                            .doc(user.uid)
                            .set({
                                hoTen: hoTen,
                                email: email,
                                uid: user.uid,
                                createdAt:
                                    firebase.firestore.FieldValue.serverTimestamp()
                            });
                    } catch (firestoreError) {
                        console.warn(
                            "⚠️ Không lưu được Firestore, nhưng tài khoản Auth đã tạo:",
                            firestoreError
                        );
                    }

                    thongBao.innerHTML =
                        "✅ Đăng ký thành công! Đang chuyển trang...";
                    thongBao.style.color = "green";

                    setTimeout(function () {
                        window.location.href = "index.html";
                    }, 1000);

                } catch (error) {

                    console.error(
                        "❌ Lỗi Firebase đăng ký:",
                        error
                    );

                    let message =
                        "❌ Đăng ký thất bại.";

                    switch (error.code) {

                        case "auth/email-already-in-use":
                            message =
                                "❌ Email này đã được đăng ký.";
                            break;

                        case "auth/invalid-email":
                            message =
                                "❌ Email không hợp lệ.";
                            break;

                        case "auth/weak-password":
                            message =
                                "❌ Mật khẩu quá yếu.";
                            break;

                        case "auth/operation-not-allowed":
                            message =
                                "❌ Firebase chưa bật đăng ký bằng Email/Password.";
                            break;

                        case "auth/network-request-failed":
                            message =
                                "❌ Không thể kết nối Firebase. Hãy kiểm tra Internet.";
                            break;

                        case "auth/too-many-requests":
                            message =
                                "❌ Có quá nhiều lần thử. Vui lòng thử lại sau.";
                            break;

                        default:
                            message =
                                "❌ " + (error.message || "Đăng ký thất bại.");
                    }

                    thongBao.innerHTML = message;
                    thongBao.style.color = "red";
                }
            });
    </script>


</body>

</html>
