<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Đăng ký đặt vé</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            background-color: #EEF5FF;
            font-family: Arial, sans-serif;
        }

        .form-container {
            background-color: #B4D4FF;
            max-width: 420px;
            margin: 50px auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
        }

        .form-container h2 {
            text-align: center;
            color: #176B87;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            color: #176B87;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #86B6F6;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #176B87;
        }

        .btn-group {
            display: flex;
            justify-content: space-between;
        }

        .btn-confirm {
            background-color: #176B87;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-confirm:hover {
            background-color: #86B6F6;
        }
.btn-cancel {
            background: #e53935 !important;
            color: #ffffff !important;
            border: 1px solid #d32f2f !important;
            border-radius: 8px;
            cursor: pointer;
            transition: .2s ease;
        }

        .btn-cancel:hover {
            background: #c62828 !important;
            border-color: #b71c1c !important;
        }

        .btn-cancel:active {
            background: #b71c1c !important;
        }

        .btn-cancel:hover {
            background-color: #176B87;
            color: white;
        }

        /* Ảnh nền rõ hơn */
        .background {
            min-height: 100vh;
            background:
                linear-gradient(rgba(255, 255, 255, 0.15),
                    rgba(255, 255, 255, 0.15)),
                url("vietnam-airlines.png");
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Form nổi bật, dễ đọc */
        .form-container {
            width: 420px;
            padding: 25px;
            border-radius: 14px;
            background: rgba(180, 215, 255, 0.96);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
        }

        /* Tiêu đề */
        .form-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #0b4f6c;
        }

    </style>
</head>

<body>
    <div class="background">
        <div class="form-container">
            <h2>Đăng ký đặt vé</h2>

            <label>Họ và tên</label>
            <input type="text" id="hoten">

            <label>Số điện thoại</label>
            <input type="text" id="sdt" placeholder="0xxxxxxxxx">

            <label>Email</label>
            <input type="email" id="email">

            <label>Số người đi</label>
            <select id="songuoi">
                <option value="">-- Chọn số người --</option>
                <option>1</option>
                <option>2</option>
                <option>3</option>
                <option>4</option>
                <option>5</option>
                <option>6</option>
                <option>7</option>
                <option>8</option>
                <option>9</option>
                <option>10</option>
            </select>

            <div class="btn-group">
                <button class="btn-confirm" onclick="xacNhan()">Xác nhận đặt vé</button>
                <button class="btn-cancel" onclick="huyDatVe()">Hủy đặt vé</button>
            </div>

            <div id="xemChiTiet" style="display:none; margin-top:15px; text-align:center">
                <button class="btn-confirm" onclick="sangTrangChiTiet()">
                    Xem chi tiết
                </button>
            </div>
        </div>

        <!-- HỘP THOẠI THÀNH CÔNG -->
        <div id="popup" style="
    display:none;
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:rgba(0,0,0,0.4);
">

            <div style="
        background:#EEF5FF;
        width:350px;
        margin:120px auto;
        padding:20px;
        border-radius:12px;
    ">
                <p><b>Trang này cho biết</b></p>
                <p>Đặt vé thành công!</p>

                <div style="text-align:right">
                    <button onclick="sangTrangChiTiet()" style="
                    background:#176B87;
                    color:white;
                    border:none;
                    padding:8px 16px;
                    border-radius:20px;
                ">
                        Xem chi tiết
                    </button>
                </div>
            </div>
        </div>
    </div>


    <script>
        function xacNhan() {
            var hoten = document.getElementById("hoten").value.trim();
            var sdt = document.getElementById("sdt").value.trim();
            var email = document.getElementById("email").value.trim();
            var songuoi = document.getElementById("songuoi").value;

            if (hoten === "" || sdt === "" || email === "" || songuoi === "") {
                alert("Bạn chưa điền đầy đủ thông tin!");
                return;
            }

            var regexSDT = /^0\d{9}$/;
            if (!regexSDT.test(sdt)) {
                alert("Số điện thoại phải có 10 số và bắt đầu bằng số 0!");
                return;
            }

            // LƯU DỮ LIỆU
            localStorage.setItem("hoten", hoten);
            localStorage.setItem("sdt", sdt);
            localStorage.setItem("email", email);
            localStorage.setItem("songuoi", songuoi);

        

            // HIỆN POPUP (THAY ALERT)
            document.getElementById("popup").style.display = "block";
        }

        function sangTrangChiTiet() {
            window.location.href = "chitiet.html";
        }

        function huyDatVe() {
            // quay về trang ban đầu
            window.location.href = "index.html";
        }

        function sangTrangChiTiet() {
            window.location.href = "chitiet.html";
        }
    </script>

</body>

</html>
