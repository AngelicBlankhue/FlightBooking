<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile - FlightBooking</title>

<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eef7ff;color:#17324d}
.top{height:68px;background:#0b5c6b;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px}
.logo{font-size:20px;font-weight:700}
.nav{display:flex;align-items:center;gap:8px}
.nav a,.logout{color:#fff;text-decoration:none;padding:9px 12px;border:0;background:transparent;border-radius:8px;cursor:pointer}
.nav a:hover,.logout:hover{background:#176b87}

.page{max-width:900px;margin:35px auto;padding:0 18px}
.card{background:#fff;border-radius:18px;padding:30px;box-shadow:0 8px 28px rgba(0,0,0,.08)}
.title{text-align:center;margin-bottom:24px}
.title h1{margin:0;color:#0b4f6c}
.title p{color:#667}

.profile-head{text-align:center}
.avatar-box{position:relative;width:130px;height:130px;margin:auto}
.avatar{
 width:130px;height:130px;border-radius:50%;object-fit:cover;
 background:#dceeff;color:#176b87;border:5px solid #eef7ff;
 display:flex;align-items:center;justify-content:center;
 font-size:48px;font-weight:bold;overflow:hidden
}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar-upload{
 position:absolute;right:2px;bottom:2px;width:40px;height:40px;
 border-radius:50%;border:3px solid white;background:#176b87;color:white;
 display:flex;align-items:center;justify-content:center;cursor:pointer;
 box-shadow:0 3px 10px rgba(0,0,0,.2)
}
.avatar-upload:hover{background:#0b4f6c}
.name{font-size:23px;font-weight:bold;color:#0b4f6c;margin-top:15px}
.email{color:#667;margin-top:6px}

.form{max-width:620px;margin:30px auto 0}
.field{margin-bottom:17px}
label{display:block;font-weight:bold;margin-bottom:7px}
input{width:100%;padding:12px;border:1px solid #b9cfe3;border-radius:9px;font-size:15px;outline:none}
input:focus{border-color:#176b87}
input[readonly]{background:#f2f5f8}
.btn{padding:12px 18px;border:0;border-radius:9px;background:#176b87;color:#fff;font-weight:bold;cursor:pointer}
.btn:hover{background:#0b4f6c}
.status{display:none;margin-top:14px;padding:11px;border-radius:9px}
.status.show{display:block}
.status.ok{background:#e3f7e9;color:#176b3a}
.status.err{background:#ffe5e5;color:#a4001c}
.loading{text-align:center;padding:70px;color:#176b87}
.hidden{display:none!important}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:28px}
.stat{background:#f3f9ff;border-radius:10px;padding:16px;text-align:center}
.stat b{display:block;font-size:22px;color:#0b4f6c}
.stat span{font-size:12px;color:#667}

@media(max-width:650px){
 .top{height:auto;min-height:68px;flex-direction:column;padding:12px;gap:8px}
 .nav{flex-wrap:wrap;justify-content:center}
 .stats{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header class="top">
 <div class="logo">✈️ FlightBooking</div>
 <nav class="nav">
  <a href="index.html">Trang chủ</a>
  <a href="lichsu.html">Lịch sử đặt vé</a>
  <button class="logout" onclick="logout()">Đăng xuất</button>
 </nav>
</header>

<div id="loading" class="loading">Đang tải hồ sơ...</div>

<main id="page" class="page hidden">
 <div class="title">
  <h1>Hồ sơ cá nhân</h1>
  <p>Quản lý thông tin tài khoản của bạn</p>
 </div>

 <section class="card">
  <div class="profile-head">

   <div class="avatar-box">
    <div id="avatar" class="avatar"></div>

    <label class="avatar-upload" title="Đổi avatar">
     📷
     <input id="avatarFile" type="file" accept="image/png,image/jpeg,image/webp" hidden onchange="uploadAvatar(this.files[0])">
    </label>
   </div>

   <div id="displayName" class="name">Khách hàng</div>
   <div id="displayEmail" class="email"></div>
  </div>

  <div class="form">
   <div class="field">
    <label for="hoTen">Họ và tên</label>
    <input id="hoTen" type="text" placeholder="Nhập họ và tên">
   </div>

   <div class="field">
    <label for="sdt">Số điện thoại</label>
    <input id="sdt" type="tel" placeholder="Nhập số điện thoại">
   </div>

   <div class="field">
    <label>Email</label>
    <input id="email" readonly>
   </div>

   <button class="btn" onclick="saveProfile()">Lưu thay đổi</button>
   <div id="status" class="status"></div>
  </div>

  <div class="stats">
   <div class="stat"><b id="total">0</b><span>Tổng đơn</span></div>
   <div class="stat"><b id="active">0</b><span>Đang đặt</span></div>
   <div class="stat"><b id="cancelled">0</b><span>Đã hủy</span></div>
  </div>
 </section>
</main>

<script>
const firebaseConfig = {
 apiKey: "AIzaSyBKr3kRw_2w3BNfR5dSpsLpsHWg5igeqJw",
 authDomain: "flightbooking-6fcdd.firebaseapp.com",
 projectId: "flightbooking-6fcdd",
 storageBucket: "flightbooking-6fcdd.firebasestorage.app",
 messagingSenderId: "481452769984",
 appId: "1:481452769984:web:45c32d3c9d3b6a92dba325",
 measurementId: "G-J929JY5NQY"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* Cloudinary */
const CLOUD_NAME = "udixuxmj";       // Điền Cloud Name của Cloudinary
const UPLOAD_PRESET = "my_img";

let currentUser = null;

firebase.auth().onAuthStateChanged(async user => {
 if (!user) {
  location.href = "dangnhap.html";
  return;
 }

 currentUser = user;

 document.getElementById("loading").classList.add("hidden");
 document.getElementById("page").classList.remove("hidden");
 document.getElementById("email").value = user.email || "";
 document.getElementById("displayEmail").textContent = user.email || "";

 await loadProfile();
 await loadStats();
});

function fallbackAvatar() {
 const name = currentUser?.displayName || currentUser?.email || "?";
 const box = document.getElementById("avatar");
 box.innerHTML = "";
 box.textContent = name.trim().charAt(0).toUpperCase();
}

function showAvatar(url) {
 const box = document.getElementById("avatar");
 box.innerHTML = "";

 const img = document.createElement("img");
 img.src = url;
 img.alt = "Avatar";
 img.onload = () => {
  box.innerHTML = "";
  box.appendChild(img);
 };
 img.onerror = fallbackAvatar;
 box.appendChild(img);
}

async function loadProfile() {
 try {
  const snap = await db.collection("users").doc(currentUser.uid).get();
  const data = snap.exists ? snap.data() : {};

  document.getElementById("hoTen").value =
   data.hoTen || data.hoten || currentUser.displayName || "";

  document.getElementById("sdt").value =
   data.sdt || data.phone || "";

  document.getElementById("displayName").textContent =
   data.hoTen || data.hoten || currentUser.displayName || "Khách hàng";

  if (data.avatarUrl) showAvatar(data.avatarUrl);
  else fallbackAvatar();

 } catch (e) {
  console.error(e);
  fallbackAvatar();
  showStatus("Không tải được hồ sơ: " + e.message, true);
 }
}

async function uploadAvatar(file) {
 if (!file || !currentUser) return;

 if (!CLOUD_NAME) {
  showStatus("Cậu chưa điền Cloud Name của Cloudinary trong profile.html.", true);
  document.getElementById("avatarFile").value = "";
  return;
 }

 if (file.size > 5 * 1024 * 1024) {
  showStatus("Ảnh phải nhỏ hơn 5MB.", true);
  document.getElementById("avatarFile").value = "";
  return;
 }

 if (!["image/jpeg","image/png","image/webp"].includes(file.type)) {
  showStatus("Chỉ hỗ trợ JPG, PNG hoặc WEBP.", true);
  document.getElementById("avatarFile").value = "";
  return;
 }

 try {
  showStatus("Đang tải avatar lên...", false);

  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", UPLOAD_PRESET);

  const response = await fetch(
   `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
   {method:"POST", body:formData}
  );

  const result = await response.json();

  if (!response.ok || !result.secure_url) {
   throw new Error(result.error?.message || "Cloudinary upload thất bại");
  }

  const avatarUrl = result.secure_url;

  await db.collection("users").doc(currentUser.uid).set({
   avatarUrl: avatarUrl,
   updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }, {merge:true});

  showAvatar(avatarUrl);
  showStatus("Đã cập nhật avatar thành công.", false);

 } catch (e) {
  console.error(e);
  showStatus("Không thể tải avatar: " + e.message, true);
 } finally {
  document.getElementById("avatarFile").value = "";
 }
}

async function saveProfile() {
 const hoTen = document.getElementById("hoTen").value.trim();
 const sdt = document.getElementById("sdt").value.trim();

 if (!hoTen) {
  showStatus("Vui lòng nhập họ và tên.", true);
  return;
 }

 try {
  await db.collection("users").doc(currentUser.uid).set({
   hoTen,
   sdt,
   email: currentUser.email || "",
   uid: currentUser.uid,
   updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }, {merge:true});

  await currentUser.updateProfile({displayName: hoTen});

  document.getElementById("displayName").textContent = hoTen;
  showStatus("Đã lưu thông tin hồ sơ.", false);

 } catch (e) {
  console.error(e);
  showStatus("Không thể lưu: " + e.message, true);
 }
}

async function loadStats() {
 try {
  const snap = await db.collection("datVe")
   .where("userId","==",currentUser.uid)
   .get();

  let active = 0, cancelled = 0;

  snap.forEach(doc => {
   const status = String(doc.data().trangThai || "").toLowerCase();
   if (status.includes("hủy") || status.includes("huy") || status.includes("cancel"))
    cancelled++;
   else active++;
  });

  document.getElementById("total").textContent = snap.size;
  document.getElementById("active").textContent = active;
  document.getElementById("cancelled").textContent = cancelled;
 } catch(e) {
  console.warn(e);
 }
}

function showStatus(text, error) {
 const box = document.getElementById("status");
 box.textContent = text;
 box.className = "status show " + (error ? "err" : "ok");

 setTimeout(() => box.className = "status", 3500);
}

function logout() {
 firebase.auth().signOut().then(() => {
  location.href = "dangnhap.html";
 });
}
</script>

</body>
</html>
